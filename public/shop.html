<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f2e9">
<title>All products | Alola</title>
<meta name="description" content="Browse every Alola product. Filter by category, brand, price and rating.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/store.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/rtl.css">
<script src="js/i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/track.js"></script>
</head>
<body>
<main class="wrap">
  <div class="page-h">
    <h1>All <em>products</em></h1>
    <p>Everything we stock, all in one place.</p>
  </div>
  <div class="pl">
    <aside class="side" id="filters" aria-label="Filters">
      <div class="side-h"><h3>Filters</h3><button class="icon-btn" id="filtersClose" aria-label="Close filters"></button></div>
      <div><h4><label for="q">Search</label></h4><div class="searchbox" id="searchBox"><input class="in" id="q" type="search" placeholder="e.g. Anua serum…" autocomplete="off"></div></div>
      <div><h4>Category</h4><div class="fc" id="fCat"></div></div>
      <div><h4>Brand</h4><div id="fBrand"></div></div>
      <div><h4>Price</h4><div class="pv"><span id="pMinL"></span><span id="pMaxL"></span></div>
        <div class="dual"><div class="track"></div><div class="fill" id="pFill"></div>
          <input type="range" id="pMin" aria-label="Minimum price"><input type="range" id="pMax" aria-label="Maximum price"></div></div>
      <div><h4>Rating</h4><div class="fc" id="fRating"></div></div>
      <div><h4>Availability</h4>
        <label class="chk"><input type="checkbox" id="fStock"> In stock only</label>
        <label class="chk"><input type="checkbox" id="fSale"> On sale</label>
        <label class="chk"><input type="checkbox" id="fSaved"> My saved items</label></div>
      <button class="btn dk ftg" id="filtersApply" style="width:100%"></button>
    </aside>
    <div>
      <div class="toolbar">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn dk ftg" id="filtersOpen" style="padding:10px 20px">Filters</button><span class="cnt" id="count" aria-live="polite"></span></div>
        <div><label class="sr" for="sort">Sort by</label><select class="in" id="sort">
          <option value="featured">Sort: Featured</option><option value="new">Newest first</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating">Top rated</option><option value="name">Name: A to Z</option>
        </select></div>
      </div>
      <div class="active" id="activeF"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</main>
<script src="js/art.js"></script>
<script src="js/common.js"></script>
<script src="js/popup.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
