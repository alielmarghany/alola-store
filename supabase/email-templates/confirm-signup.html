<!-- Paste into Supabase: Authentication > Emails > Confirm signup. Suggested subject: Confirm your Alola account | تأكيد حسابك في العلا -->
<div style="background:#f6f2e9;padding:24px 12px;font-family:Arial,Tahoma,sans-serif;color:#3b261d">
  <div style="max-width:520px;margin:auto;background:#ffffff;border-radius:18px;padding:28px">
    <div dir="rtl" style="text-align:right">
      <h2 style="margin:0 0 8px;color:#3b261d">أهلًا بكِ في العلا</h2>
      <p style="margin:0 0 16px;line-height:1.7;color:#5c4a3f">اضغطي على الزر لتأكيد بريدك وتفعيل حسابك.</p>
      <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3b261d;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:99px">تأكيد البريد</a></p>
    </div>
    <hr style="border:0;border-top:1px solid #eadfce;margin:0 0 24px">
    <div dir="ltr" style="text-align:left">
      <h2 style="margin:0 0 8px;color:#3b261d">Welcome to Alola</h2>
      <p style="margin:0 0 16px;line-height:1.6;color:#5c4a3f">Click the button to confirm your email and activate your account.</p>
      <p style="margin:0 0 20px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3b261d;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:99px">Confirm my email</a></p>
      <p style="margin:0;font-size:12px;line-height:1.6;color:#7a6b60">If you didn’t create an account, you can ignore this email. إذا لم تنشئي حسابًا، يمكنك تجاهل هذه الرسالة.</p>
    </div>
  </div>
</div>
